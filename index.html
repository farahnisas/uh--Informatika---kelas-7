<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b1f">
<title>Ulangan Informatika • Kelas VII</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b1f;
    --bg2:#10152f;
    --card:rgba(19,24,52,.82);
    --card2:rgba(255,255,255,.055);
    --primary:#7c5cff;
    --primary2:#a78bfa;
    --cyan:#38d9ff;
    --pink:#f472b6;
    --green:#34d399;
    --red:#fb7185;
    --yellow:#facc15;
    --text:#f8fafc;
    --muted:#929bb5;
    --line:rgba(255,255,255,.10);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(124,92,255,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(56,217,255,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(244,114,182,.10),
            transparent 35%
        ),
        var(--bg);

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    opacity:.25;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ==================================================
   TOPBAR
================================================== */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:rgba(8,11,31,.86);
    backdrop-filter:blur(20px);

    border-bottom:1px solid var(--line);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--pink)
        );

    font-size:21px;

    box-shadow:
        0 0 30px rgba(124,92,255,.3);
}

.brand strong{
    display:block;
    font-size:12px;
    letter-spacing:.5px;
}

.brand small{
    display:block;
    margin-top:2px;

    color:var(--muted);

    font-size:8px;
    letter-spacing:.5px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.music-btn{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border:1px solid var(--line);
    border-radius:12px;

    background:rgba(255,255,255,.05);
    color:white;

    font-size:17px;
}

.timer{
    min-width:88px;

    padding:9px 12px;

    text-align:center;

    border:1px solid var(--line);
    border-radius:12px;

    background:rgba(255,255,255,.05);

    font-size:12px;
    font-weight:950;
}

.timer.warning{
    color:#fecdd3;

    border-color:
        rgba(251,113,133,.65);

    animation:timerPulse 1s infinite;
}

@keyframes timerPulse{
    50%{
        box-shadow:
            0 0 0 5px
            rgba(251,113,133,.08);
    }
}

/* ==================================================
   CONTAINER
================================================== */

.container{
    width:min(1080px,calc(100% - 28px));
    margin:auto;
    padding:30px 0 60px;
}

/* ==================================================
   START PAGE
================================================== */

.start-wrap{
    min-height:
        calc(100vh - 130px);

    display:flex;
    align-items:center;
    justify-content:center;
}

.start-card{
    width:min(570px,100%);

    position:relative;

    padding:38px;

    text-align:center;

    border:1px solid var(--line);
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(25px);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.35);

    overflow:hidden;
}

.start-card::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-160px;
    right:-110px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(124,92,255,.25),
            transparent 70%
        );
}

.start-card::after{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    bottom:-160px;
    left:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(56,217,255,.14),
            transparent 70%
        );
}

.hero-icon{
    width:105px;
    height:105px;

    margin:0 auto 22px;

    display:grid;
    place-items:center;

    position:relative;
    z-index:2;

    border-radius:31px;

    font-size:57px;

    background:
        linear-gradient(
            145deg,
            rgba(124,92,255,.20),
            rgba(56,217,255,.08)
        );

    border:1px solid var(--line);

    box-shadow:
        0 0 50px
        rgba(124,92,255,.12);

    animation:heroFloat 3s ease-in-out infinite;
}

@keyframes heroFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.start-card h1{
    position:relative;
    z-index:2;

    font-size:
        clamp(30px,6vw,43px);

    line-height:1.02;

    letter-spacing:-1.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #c4b5fd,
            #67e8f9
        );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    position:relative;
    z-index:2;

    margin-top:8px;
    margin-bottom:25px;

    color:var(--muted);

    font-size:11px;
}

.form{
    position:relative;
    z-index:3;

    text-align:left;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;

    margin-bottom:6px;

    color:#dce3f2;

    font-size:10px;
    font-weight:900;
    letter-spacing:.4px;
}

.field input,
.field select{
    width:100%;
    height:48px;

    padding:0 14px;

    outline:none;

    color:white;

    border:1px solid var(--line);
    border-radius:13px;

    background:rgba(255,255,255,.045);

    transition:.2s;
}

.field input::placeholder{
    color:#69728b;
}

.field input:focus,
.field select:focus{
    border-color:
        rgba(124,92,255,.75);

    box-shadow:
        0 0 0 4px
        rgba(124,92,255,.10);
}

.field select option{
    background:#11162e;
}

.two-field{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.exam-info{
    position:relative;
    z-index:3;

    display:flex;
    justify-content:center;
    gap:25px;

    margin:17px 0;

    color:var(--muted);

    font-size:10px;
}

.exam-info strong{
    color:#e7edf8;
}

.start-btn{
    width:100%;
    height:52px;

    position:relative;
    z-index:3;

    border:0;
    border-radius:15px;

    color:white;

    font-size:13px;
    font-weight:950;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #9b6cff
        );

    box-shadow:
        0 15px 35px
        rgba(124,92,255,.28);

    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 20px 42px
        rgba(124,92,255,.38);
}

.music-control{
    position:relative;
    z-index:3;

    display:flex;
    align-items:center;
    gap:10px;

    margin-top:13px;
    padding:9px 11px;

    border:1px solid var(--line);
    border-radius:12px;

    background:rgba(255,255,255,.035);
}

.music-control span{
    white-space:nowrap;

    color:#b6bfd1;

    font-size:9px;
}

.volume{
    flex:1;

    accent-color:var(--primary);

    cursor:pointer;
}

.teacher{
    position:relative;
    z-index:3;

    margin-top:13px;

    color:#69728b;

    font-size:8px;
}

/* ==================================================
   EXAM LAYOUT
================================================== */

.exam-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        245px;

    gap:16px;
}

.exam-card,
.sidebar{
    border:1px solid var(--line);
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.022)
        );

    backdrop-filter:blur(20px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);
}

.exam-card{
    padding:23px;
}

.question-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.question-number{
    font-size:13px;
    font-weight:950;
}

.level{
    padding:5px 10px;

    border-radius:20px;

    color:#c4b5fd;

    background:
        rgba(124,92,255,.12);

    border:1px solid
        rgba(124,92,255,.18);

    font-size:8px;
    font-weight:950;
}

.progress-track{
    width:100%;
    height:7px;

    margin:15px 0 20px;

    overflow:hidden;

    border-radius:20px;

    background:rgba(255,255,255,.065);
}

.progress-fill{
    height:100%;
    width:0;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--cyan),
            var(--pink)
        );

    transition:.35s;
}

/* ==================================================
   ILLUSTRATION
================================================== */

.illustration{
    width:100%;
    height:235px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:21px;

    overflow:hidden;

    border:1px solid var(--line);
    border-radius:22px;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(124,92,255,.14),
            transparent 48%
        ),
        rgba(255,255,255,.025);
}

.illustration::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size:24px 24px;

    opacity:.32;
}

.scene{
    width:min(470px,92%);
    height:190px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* Main object */
.scene-main{
    position:relative;
    z-index:5;

    width:108px;
    height:108px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(124,92,255,.18),
            rgba(56,217,255,.09)
        );

    border:1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.25);

    font-size:55px;

    animation:sceneFloat 3s ease-in-out infinite;
}

@keyframes sceneFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

.scene-card{
    position:absolute;
    z-index:4;

    min-width:95px;

    padding:10px 13px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    border:1px solid
        rgba(255,255,255,.12);

    border-radius:13px;

    background:
        rgba(10,14,36,.80);

    backdrop-filter:blur(10px);

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.25);

    color:#dce4f3;

    font-size:9px;
    font-weight:900;

    white-space:nowrap;
}

.scene-card::after{
    content:"";
    position:absolute;
}

.card-left{
    left:2%;
    top:18%;
}

.card-right{
    right:2%;
    top:18%;
}

.card-bottom-left{
    left:7%;
    bottom:8%;
}

.card-bottom-right{
    right:7%;
    bottom:8%;
}

/* Connector lines */
.connector{
    position:absolute;
    z-index:2;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(167,139,250,.65),
            transparent
        );

    transform-origin:left center;
}

.connector.one{
    width:115px;
    left:23%;
    top:39%;
    transform:rotate(8deg);
}

.connector.two{
    width:115px;
    right:22%;
    top:39%;
    transform:rotate(172deg);
}

.connector.three{
    width:105px;
    left:26%;
    bottom:30%;
    transform:rotate(-10deg);
}

.connector.four{
    width:105px;
    right:24%;
    bottom:30%;
    transform:rotate(190deg);
}

/* ==================================================
   QUESTION
================================================== */

.question-text{
    margin-bottom:16px;

    color:#f4f7fb;

    font-size:
        clamp(18px,2.7vw,23px);

    line-height:1.5;

    letter-spacing:-.2px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.option{
    width:100%;

    display:flex;
    align-items:center;
    gap:11px;

    padding:12px;

    text-align:left;

    color:#edf2f8;

    border:1px solid var(--line);
    border-radius:14px;

    background:rgba(255,255,255,.035);

    transition:.18s;
}

.option:hover{
    transform:translateX(3px);

    border-color:
        rgba(124,92,255,.55);

    background:
        rgba(124,92,255,.06);
}

.option.selected{
    border-color:var(--primary);

    background:
        rgba(124,92,255,.14);

    box-shadow:
        0 5px 20px
        rgba(124,92,255,.08);
}

.letter{
    min-width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:rgba(255,255,255,.065);

    color:#b9c2d4;

    font-size:11px;
    font-weight:950;
}

.selected .letter{
    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );
}

.nav{
    display:flex;
    justify-content:space-between;

    gap:10px;

    margin-top:20px;
}

.btn{
    min-height:43px;

    padding:0 17px;

    border:1px solid var(--line);
    border-radius:12px;

    color:white;

    background:
        rgba(255,255,255,.05);

    font-size:11px;
    font-weight:900;
}

.btn.primary{
    border:0;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #9b6cff
        );
}

.btn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

/* ==================================================
   SIDEBAR
================================================== */

.sidebar{
    height:max-content;

    padding:17px;

    position:sticky;
    top:85px;
}

.student-box{
    padding:13px;

    margin-bottom:17px;

    border:1px solid var(--line);
    border-radius:14px;

    background:
        rgba(255,255,255,.035);
}

.student-box strong{
    display:block;

    font-size:11px;

    margin-bottom:3px;
}

.student-box span{
    color:var(--muted);
    font-size:9px;
}

.sidebar-title{
    margin-bottom:10px;

    font-size:10px;
    font-weight:950;
    letter-spacing:.5px;
}

.numbers{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:6px;
}

.num{
    height:31px;

    border:1px solid var(--line);
    border-radius:8px;

    color:#b7c0d2;

    background:
        rgba(255,255,255,.035);

    font-size:9px;
    font-weight:900;
}

.num.current{
    color:white;

    border-color:var(--primary);

    background:var(--primary);
}

.num.done{
    color:#86efac;

    border-color:
        rgba(52,211,153,.30);

    background:
        rgba(52,211,153,.09);
}

.submit-btn{
    width:100%;

    margin-top:16px;

    color:#fecdd3;

    border-color:
        rgba(251,113,133,.25);

    background:
        rgba(251,113,133,.07);
}

/* ==================================================
   RESULT
================================================== */

.result-card{
    width:min(700px,100%);

    margin:30px auto;

    padding:35px;

    text-align:center;

    border:1px solid var(--line);
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(22px);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.30);
}

.result-emoji{
    font-size:72px;

    animation:heroFloat 2s ease-in-out infinite;
}

.result-card h1{
    margin-top:7px;

    font-size:28px;
}

.result-name{
    margin-top:5px;

    color:var(--muted);

    font-size:11px;
}

.score{
    margin:8px 0;

    font-size:86px;
    font-weight:1000;

    line-height:1;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--cyan),
            var(--pink)
        );

    -webkit-background-clip:text;
    color:transparent;
}

.result-detail{
    color:var(--muted);

    font-size:11px;

    line-height:1.7;
}

.review{
    margin-top:25px;

    text-align:left;

    border-top:1px solid var(--line);
}

.review h3{
    margin:17px 0 10px;

    font-size:13px;
}

.review-item{
    padding:10px 0;

    border-bottom:1px solid var(--line);

    font-size:10px;

    line-height:1.55;
}

.correct{
    color:#86efac;
}

.wrong{
    color:#fda4af;
}

/* ==================================================
   CONFETTI
================================================== */

.confetti{
    position:fixed;
    inset:0;

    z-index:9999;

    pointer-events:none;

    overflow:hidden;
}

.confetti span{
    position:absolute;
    top:-30px;

    font-size:22px;

    animation:
        confettiFall 3.5s
        linear forwards;
}

@keyframes confettiFall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:800px){

    .exam-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
        order:2;
    }

    .numbers{
        grid-template-columns:
            repeat(10,1fr);
    }
}

@media(max-width:550px){

    .topbar{
        height:60px;
        padding:0 11px;
    }

    .brand-logo{
        width:35px;
        height:35px;

        border-radius:11px;

        font-size:17px;
    }

    .brand strong{
        font-size:9px;
    }

    .brand small{
        font-size:6px;
    }

    .timer{
        min-width:73px;

        padding:8px;

        font-size:9px;
    }

    .music-btn{
        width:35px;
        height:35px;
    }

    .container{
        width:calc(100% - 12px);
        padding-top:12px;
    }

    .start-wrap{
        min-height:
            calc(100vh - 90px);
    }

    .start-card{
        padding:25px 16px;
        border-radius:23px;
    }

    .hero-icon{
        width:88px;
        height:88px;

        margin-bottom:17px;

        border-radius:25px;

        font-size:47px;
    }

    .start-card h1{
        font-size:29px;
    }

    .subtitle{
        margin-bottom:20px;
        font-size:9px;
    }

    .two-field{
        gap:7px;
    }

    .field input,
    .field select{
        height:46px;

        padding:0 11px;

        font-size:11px;
    }

    .exam-info{
        gap:15px;
        font-size:9px;
    }

    .exam-card{
        padding:15px;
        border-radius:20px;
    }

    .illustration{
        height:205px;
        margin-bottom:17px;
        border-radius:18px;
    }

    .scene{
        height:170px;
        width:96%;
    }

    .scene-main{
        width:82px;
        height:82px;

        border-radius:23px;

        font-size:42px;
    }

    .scene-card{
        min-width:auto;

        padding:7px 9px;

        border-radius:9px;

        font-size:7px;
    }

    .card-left{
        left:0;
        top:12%;
    }

    .card-right{
        right:0;
        top:12%;
    }

    .card-bottom-left{
        left:3%;
        bottom:8%;
    }

    .card-bottom-right{
        right:3%;
        bottom:8%;
    }

    .connector.one{
        width:75px;
        left:20%;
    }

    .connector.two{
        width:75px;
        right:19%;
    }

    .connector.three{
        width:70px;
        left:22%;
    }

    .connector.four{
        width:70px;

/* ==================================================
   MUSIC
================================================== */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );

let musicOn = true;

bgMusic.volume = 0.8;


function startMusic(){

    if(!musicOn){
        return;
    }


    const slider =
        document.getElementById(
            "volume"
        );


    bgMusic.volume =
        Number(slider.value)/100;


    bgMusic.play()
        .then(()=>{

            document.getElementById(
                "musicBtn"
            ).textContent="🔊";

            document.getElementById(
                "musicText"
            ).textContent=
                "🎵 Musik ON";

        })
        .catch(error=>{

            console.log(
                "Audio belum dapat diputar:",
                error
            );

        });

}


function toggleMusic(){

    if(bgMusic.paused){

        musicOn=true;

        startMusic();

    }else{

        musicOn=false;

        bgMusic.pause();

        document.getElementById(
            "musicBtn"
        ).textContent="🔇";

        document.getElementById(
            "musicText"
        ).textContent=
            "🔇 Musik OFF";

    }

}


function changeVolume(value){

    bgMusic.volume =
        Number(value)/100;

}


/* ==================================================
   START EXAM
================================================== */

function startExam(){

    const name =
        document.getElementById(
            "studentName"
        ).value.trim();

    const kelas =
        document.getElementById(
            "studentClass"
        ).value;

    const absen =
        document.getElementById(
            "studentNumber"
        ).value;


    if(!name){

        alert(
            "Nama lengkap belum diisi."
        );

        return;

    }


    if(!kelas){

        alert(
            "Silakan pilih kelas."
        );

        return;

    }


    if(!absen){

        alert(
            "Silakan pilih nomor absen."
        );

        return;

    }


    started=true;


    document.getElementById(
        "startPage"
    ).classList.add("hidden");


    document.getElementById(
        "examPage"
    ).classList.remove("hidden");


    document.getElementById(
        "sideName"
    ).textContent=name;


    document.getElementById(
        "sideInfo"
    ).textContent=
        `${kelas} • Absen ${absen}`;


    renderQuestion();

    startTimer();

    startMusic();


    /*
      Fullscreen hanya dicoba setelah
      interaksi tombol pengguna.
    */

    if(
        document.documentElement
            .requestFullscreen
    ){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});

    }

}


/* ==================================================
   TIMER
================================================== */

function startTimer(){

    timerInterval =
        setInterval(()=>{

            seconds--;


            const minutes =
                Math.floor(
                    seconds/60
                );

            const secs =
                seconds%60;


            document.getElementById(
                "timer"
            ).textContent =
                `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;


            if(seconds<=300){

                document.getElementById(
                    "timer"
                ).classList.add(
                    "warning"
                );

            }


            if(seconds<=0){

                finishExam(
                    "Waktu habis"
                );

            }

        },1000);

}

                ${q.cards[0]}
            </div>

            <div class="scene-card card-right">
                ${q.cards[1]}
            </div>

            <div class="scene-card card-bottom-left">
                ${q.cards[2]}
            </div>

            <div class="scene-card card-bottom-right">
                ${q.cards[3]}
            </div>

            <div class="connector one"></div>
            <div class="connector two"></div>
            <div class="connector three"></div>
            <div class="connector four"></div>

            <div class="scene-main">
                ${q.icon}
            </div>

        </div>

    `;

}


/* ==================================================
   RENDER QUESTION
================================================== */

function renderQuestion(){

    const q =
        questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).textContent =
        `Soal ${currentQuestion+1} dari ${questions.length}`;


    document.getElementById(
        "questionLevel"
    ).textContent =
        q.level;


    const progress =
        ((currentQuestion+1) /
        questions.length) *
        100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress+"%";


    renderIllustration(q);


    document.getElementById(
        "questionText"
    ).textContent =
        q.question;


    const options =
        document.getElementById(
            "options"
        );

    options.innerHTML="";


    q.options.forEach(
        (text,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className="option";


            if(
                answers[currentQuestion] ===
                index
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.innerHTML=`

                <span class="letter">
                    ${String.fromCharCode(65+index)}
                </span>

                <span>
                    ${text}
                </span>

            `;


            button.onclick=()=>{

                answers[
                    currentQuestion
                ]=index;

                renderQuestion();

            };


            options.appendChild(button);

        }
    );


    document.getElementById(
        "prevBtn"
    ).disabled =
        currentQuestion===0;


    document.getElementById(
        "nextBtn"
    ).textContent =
        currentQuestion ===
        questions.length-1
        ? "🏁 Kumpulkan"
        : "Berikutnya →";


    renderNumbers();

}


/* ==================================================
   QUESTION NUMBERS
================================================== */

function renderNumbers(){

    const box =
        document.getElementById(
            "numbers"
        );

    box.innerHTML="";


    questions.forEach(
        (_,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className="num";

            button.textContent =
                index+1;


            if(
                answers[index] !== null
            ){

                button.classList.add(
                    "done"
                );

            }


            if(
                index === currentQuestion
            ){

                button.classList.add(
                    "current"
                );

            }


            button.onclick=()=>{

                currentQuestion =
                    index;

                renderQuestion();

            };


            box.appendChild(button);

        }
    );

}


/* ==================================================
   NAVIGATION
================================================== */

function nextQuestion(){

    if(
        currentQuestion <
        questions.length-1
    ){

        currentQuestion++;

        renderQuestion();

    }else{

        confirmSubmit();

    }

}


function previousQuestion(){

    if(currentQuestion>0){

        currentQuestion--;

        renderQuestion();

    }

}


/* ==================================================
   SUBMIT
================================================== */

function confirmSubmit(){

    const unanswered =
        answers.filter(
            answer =>
                answer === null
        ).length;


    if(unanswered>0){

        const yes =
            confirm(
                `Masih ada ${unanswered} soal yang belum dijawab.\n\nYakin ingin mengumpulkan?`
            );

        if(!yes){
            return;
        }

    }else{

        const yes =
            confirm(
                "Semua soal sudah dijawab.\n\nYakin ingin mengumpulkan?"
            );

        if(!yes){
            return;
        }

    }


    finishExam(
        "Ujian dikumpulkan"
    );

}


/* ==================================================
   ANTI CHEATING
================================================== */

function violation(message){

    if(
        !started ||
        finished
    ){
        return;
    }


    violations++;


    alert(
        `⚠️ PERINGATAN ${violations}/3\n\n${message}`
    );


    if(violations>=3){

        finishExam(
            "Ujian dihentikan karena pelanggaran"
        );

    }

}


/*
   Tab / halaman ditinggalkan
*/

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            started &&
            !finished &&
            document.hidden
        ){

            violation(
                "Kamu meninggalkan halaman ujian."
            );

        }

    }
);


/*
   Copy / Cut / Paste
*/

[
    "copy",
    "cut",
    "paste"
].forEach(
    eventName=>{

        document.addEventListener(
            eventName,
            event=>{

                if(
                    started &&
                    !finished
                ){

                    event.preventDefault();

                    violation(
                        `${eventName.toUpperCase()} tidak diperbolehkan.`
                    );

                }

            }
        );

    }
);


/*
   Fullscreen keluar
*/

document.addEventListener(
    "fullscreenchange",
    ()=>{

        if(
            started &&
            !finished &&
            !document.fullscreenElement
        ){

            violation(
                "Mode fullscreen ditutup."
            );

        }

    }
);


/* ==================================================
   FINISH EXAM
================================================== */

async function finishExam(reason){

    if(finished){
        return;
    }


    finished=true;


    clearInterval(
        timerInterval
    );


    bgMusic.pause();


    let correct=0;


    answers.forEach(
        (answer,index)=>{

            if(
                answer ===
                questions[index].answer
            ){

                correct++;

            }

        }
    );


    const score =
        Math.round(
            correct /
            questions.length *
            100
        );


    const happy =
        score>=75;


    document.getElementById(
        "examPage"
    ).classList.add("hidden");


    document.getElementById(
        "resultPage"
    ).classList.remove("hidden");


    document.getElementById(
        "resultEmoji"
    ).textContent =
        happy
        ? "🥳🎉"
        : "😢💪";


    document.getElementById(
        "resultTitle"
    ).textContent =
        happy
        ? "Mantap! Kamu Hebat! 🎉"
        : "Tetap Semangat! 💪";


    document.getElementById(
        "resultName"
    ).textContent =
        `${document.getElementById("studentName").value}
        • ${document.getElementById("studentClass").value}
        • Absen ${document.getElementById("studentNumber").value}`;


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "resultDetail"
    ).textContent =
        `${correct} dari ${questions.length} soal benar • ${reason}`;


    if(happy){

        createConfetti();

    }


    const data={

        timestamp:
            new Date().toLocaleString(
                "id-ID"
            ),

        nama:
            document.getElementById(
                "studentName"
            ).value.trim(),

        kelas:
            document.getElementById(
                "studentClass"
            ).value,

        no_absen:
            document.getElementById(
                "studentNumber"
            ).value,

        guru:
            "Farah Nisa",

        bab:
            "BAB 1 - Berpikir Komputasional",

        nilai:
            score,

        benar:
            correct,

        total:
            questions.length,

        pelanggaran:
            violations,

        status:
            reason

    };


    const sent =
        await sendToSpreadsheet(data);


    document.getElementById(
        "sendStatus"
    ).textContent =
        sent
        ? "✅ Nilai berhasil dikirim ke spreadsheet."
        : "⚠️ Spreadsheet belum terhubung.";

    
    createReview();

}


/* ==================================================
   SEND TO GOOGLE SHEET
================================================== */

async function sendToSpreadsheet(data){

    if(
        GOOGLE_SCRIPT_URL.includes(
            "TEMPEL_URL"
        )
    ){

        return false;

    }


    try{

        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)

            }
        );


        return true;

    }catch(error){

        console.error(error);

        return false;

    }

}


/* ==================================================
   REVIEW
================================================== */

function createReview(){

    const review =
        document.getElementById(
            "review"
        );


    review.innerHTML =
        "<h3>📋 Review Jawaban</h3>";


    questions.forEach(
        (q,index)=>{

            const isCorrect =
                answers[index] ===
                q.answer;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "review-item";


            div.innerHTML=`

                <b class="${
                    isCorrect
                    ? "correct"
                    : "wrong"
                }">

                    ${index+1}.
                    ${
                        isCorrect
                        ? "✓ Benar"
                        : "✕ Salah"
                    }

                </b>

                <br>

                ${q.question}

                <br>

                <small style="color:#7f8aa3">

                    Jawaban benar:
                    ${q.options[q.answer]}

                </small>

            `;


            review.appendChild(div);

        }
    );

}


/* ==================================================
   CONFETTI
================================================== */

function createConfetti(){

    const box =
        document.getElementById(
            "confetti"
        );


    const emojis=[
        "🎉",
        "✨",
        "🎊",
        "⭐",
        "🥳",
        "💜",
        "🧠",
        "🚀"
    ];


    for(
        let i=0;
        i<75;
        i++
    ){

        const item =
            document.createElement(
                "span"
            );


        item.textContent =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


        item.style.left =
            Math.random()*100+"%";


        item.style.animationDelay =
            Math.random()*1.5+"s";


        item.style.fontSize =
            (15 +
            Math.random()*15)+"px";


        box.appendChild(item);


        setTimeout(
            ()=>item.remove(),
            4500
        );

    }

}
