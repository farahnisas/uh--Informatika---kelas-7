<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b1a">
<title>Ulangan Informatika - Kelas VII</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080a18;
    --card:rgba(20,24,48,.78);
    --primary:#7c5cff;
    --purple:#a78bfa;
    --cyan:#38d9ff;
    --pink:#f472b6;
    --green:#34d399;
    --red:#fb7185;
    --yellow:#facc15;
    --white:#f8fafc;
    --muted:#9ba5bd;
    --border:rgba(255,255,255,.10);
}

html,body{
    min-height:100%;
}

body{
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--white);
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(124,92,255,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(56,217,255,.13),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(244,114,182,.12),
            transparent 35%
        ),
        var(--bg);

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.35;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:rgba(8,10,24,.82);
    backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:13px;

    font-size:21px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--pink)
        );

    box-shadow:
        0 0 25px rgba(124,92,255,.35);
}

.brand-text strong{
    display:block;
    font-size:13px;
    letter-spacing:.4px;
}

.brand-text small{
    color:var(--muted);
    font-size:9px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.music-btn{
    width:40px;
    height:40px;

    border:1px solid var(--border);
    border-radius:12px;

    color:white;
    background:rgba(255,255,255,.06);

    font-size:17px;
}

.timer{
    min-width:88px;

    padding:9px 12px;

    text-align:center;

    border-radius:12px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.05);

    font-size:12px;
    font-weight:900;
}

.timer.warning{
    color:#fecaca;
    border-color:rgba(251,113,133,.7);

    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:
            0 0 0 5px rgba(251,113,133,.10);
    }
}

/* =========================
   MAIN
========================= */

.container{
    width:min(1100px,calc(100% - 28px));
    margin:auto;
    padding:35px 0 55px;
}

/* =========================
   START PAGE
========================= */

.start-card{
    width:min(620px,100%);
    margin:45px auto 0;

    padding:40px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);
    border-radius:30px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.35);

    position:relative;
    overflow:hidden;
}

.start-card::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-160px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(124,92,255,.25),
            transparent 70%
        );
}

.start-card::after{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    bottom:-160px;
    left:-90px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(56,217,255,.15),
            transparent 70%
        );
}

.brain{
    width:120px;
    height:120px;

    margin:0 auto 22px;

    display:grid;
    place-items:center;

    border-radius:36px;

    font-size:65px;

    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.20),
            rgba(56,217,255,.10)
        );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 0 50px rgba(124,92,255,.15);

    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.start-card h1{
    position:relative;
    z-index:2;

    font-size:
        clamp(28px,6vw,43px);

    line-height:1.05;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c4b5fd,
            #67e8f9
        );

    -webkit-background-clip:text;
    color:transparent;

    margin-bottom:7px;
}

.start-card .chapter{
    position:relative;
    z-index:2;

    color:var(--muted);

    font-size:12px;

    margin-bottom:28px;
}

.form{
    position:relative;
    z-index:2;

    text-align:left;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;

    margin-bottom:6px;

    font-size:11px;
    font-weight:800;

    color:#dbe3f3;
}

.field input,
.field select{
    width:100%;

    height:48px;

    padding:0 14px;

    color:white;

    background:rgba(255,255,255,.055);

    border:1px solid var(--border);
    border-radius:13px;

    outline:none;
}

.field input::placeholder{
    color:#6f7890;
}

.field input:focus,
.field select:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 4px rgba(124,92,255,.10);
}

.field select option{
    background:#11152b;
    color:white;
}

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.exam-info{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:center;
    gap:20px;

    color:var(--muted);

    font-size:11px;

    margin:18px 0;
}

.exam-info b{
    color:#dce4f5;
}

.start-button{
    position:relative;
    z-index:2;

    width:100%;
    height:52px;

    border:0;
    border-radius:15px;

    color:white;

    font-weight:950;
    font-size:14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #9b6cff
        );

    box-shadow:
        0 14px 35px rgba(124,92,255,.28);

    transition:.2s;
}

.start-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 18px 40px rgba(124,92,255,.38);
}

.teacher{
    position:relative;
    z-index:2;

    margin-top:13px;

    color:#737d94;

    font-size:9px;
}

/* MUSIC */

.music-control{
    position:relative;
    z-index:2;

    margin-top:15px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:10px 12px;

    border-radius:13px;

    background:rgba(255,255,255,.04);

    border:1px solid var(--border);
}

.music-control span{
    font-size:11px;
    white-space:nowrap;
}

.volume{
    flex:1;
    accent-color:var(--primary);
}

/* =========================
   EXAM
========================= */

.exam-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 250px;
    gap:17px;
}

.exam-card,
.sidebar{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);
    border-radius:25px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.28);
}

.exam-card{
    padding:25px;
}

.question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.question-number{
    font-weight:950;
    font-size:13px;
}

.level{
    padding:5px 9px;

    border-radius:30px;

    background:rgba(124,92,255,.13);

    color:#c4b5fd;

    font-size:9px;
    font-weight:900;
}

.progress{
    height:7px;

    margin:16px 0 22px;

    border-radius:20px;

    overflow:hidden;

    background:rgba(255,255,255,.07);
}

.progress-bar{
    width:0;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--cyan),
            var(--pink)
        );

    transition:.35s;
}

/* QUESTION ILLUSTRATION */

.illustration{
    height:210px;

    margin-bottom:20px;

    position:relative;
    overflow:hidden;

    display:grid;
    place-items:center;

    border-radius:21px;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(124,92,255,.16),
            transparent 50%
        ),
        rgba(255,255,255,.025);

    border:1px solid var(--border);
}

.illustration::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            rgba(255,255,255,.13) 1px,
            transparent 1px
        );

    background-size:22px 22px;

    opacity:.35;
}

.illustration-emoji{
    position:relative;
    z-index:2;

    font-size:80px;

    filter:
        drop-shadow(
            0 15px 20px rgba(0,0,0,.35)
        );

    animation:float 3s ease-in-out infinite;
}

.bubble{
    position:absolute;
    z-index:3;

    padding:7px 10px;

    border-radius:10px;

    background:rgba(8,10,24,.78);

    border:1px solid var(--border);

    color:#dce4f5;

    font-size:9px;
    font-weight:900;

    animation:float 3s ease-in-out infinite;
}

.b1{
    top:17%;
    left:8%;
}

.b2{
    top:20%;
    right:8%;

    animation-delay:.6s;
}

.b3{
    bottom:16%;
    left:12%;

    animation-delay:1s;
}

.b4{
    bottom:13%;
    right:12%;

    animation-delay:1.4s;
}

.question-text{
    font-size:
        clamp(18px,3vw,24px);

    line-height:1.5;

    margin-bottom:17px;
}

.option{
    width:100%;

    display:flex;
    align-items:center;
    gap:11px;

    padding:13px;

    margin:9px 0;

    text-align:left;

    color:white;

    background:rgba(255,255,255,.035);

    border:1px solid var(--border);

    border-radius:14px;

    transition:.18s;
}

.option:hover{
    transform:translateX(3px);

    border-color:
        rgba(124,92,255,.55);
}

.option.selected{
    background:
        rgba(124,92,255,.14);

    border-color:var(--primary);
}

.letter{
    min-width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:rgba(255,255,255,.07);

    font-weight:950;
}

.selected .letter{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--purple)
        );
}

.nav{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-top:22px;
}

.btn{
    min-height:43px;

    padding:0 17px;

    border-radius:12px;

    font-size:12px;
    font-weight:900;

    color:white;

    border:1px solid var(--border);

    background:rgba(255,255,255,.06);
}

.btn.primary{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            #9b6cff
        );

    border:0;
}

.btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    padding:19px;
    height:max-content;
}

.student{
    padding:13px;

    margin-bottom:18px;

    border-radius:14px;

    background:rgba(255,255,255,.045);

    border:1px solid var(--border);
}

.student strong{
    display:block;

    font-size:12px;

    margin-bottom:3px;
}

.student span{
    color:var(--muted);
    font-size:10px;
}

.sidebar-title{
    font-size:12px;
    font-weight:900;

    margin-bottom:11px;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.num{
    height:32px;

    border-radius:8px;

    color:#cbd5e1;

    background:rgba(255,255,255,.035);

    border:1px solid var(--border);

    font-size:10px;
    font-weight:900;
}

.num.done{
    color:#86efac;
    background:rgba(52,211,153,.10);
    border-color:rgba(52,211,153,.30);
}

.num.current{
    color:white;
    background:var(--primary);
    border-color:var(--primary);
}

.submit{
    width:100%;
    margin-top:18px;

    color:#fecdd3;

    border-color:rgba(251,113,133,.25);
    background:rgba(251,113,133,.08);
}

/* =========================
   RESULT
========================= */

.result-card{
    width:min(700px,100%);
    margin:35px auto;

    padding:38px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);
    border-radius:28px;

    backdrop-filter:blur(22px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.32);
}

.result-emoji{
    font-size:75px;

    animation:float 2s ease-in-out infinite;
}

.result-card h1{
    font-size:30px;
    margin:8px 0;
}

.result-name{
    color:var(--muted);
    font-size:12px;
}

.score{
    font-size:85px;
    font-weight:1000;

    line-height:1.1;

    margin:10px 0;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--cyan),
            var(--pink)
        );

    -webkit-background-clip:text;
    color:transparent;
}

.result-detail{
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

.send-status{
    margin-top:10px;
}

.review{
    margin-top:25px;
    text-align:left;

    border-top:1px solid var(--border);
}

.review h3{
    font-size:14px;
    margin:18px 0 10px;
}

.review-item{
    padding:11px 0;

    border-bottom:1px solid var(--border);

    font-size:11px;
    line-height:1.5;
}

.correct{
    color:#86efac;
}

.wrong{
    color:#fda4af;
}

/* =========================
   CONFETTI
========================= */

.confetti{
    position:fixed;
    inset:0;

    overflow:hidden;
    pointer-events:none;

    z-index:999;
}

.confetti span{
    position:absolute;
    top:-30px;

    font-size:22px;

    animation:
        fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .exam-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        order:2;
    }

    .numbers{
        grid-template-columns:repeat(10,1fr);
    }
}

@media(max-width:550px){

    .topbar{
        padding:0 12px;
        height:60px;
    }

    .brand-icon{
        width:36px;
        height:36px;
        font-size:18px;
    }

    .brand-text strong{
        font-size:10px;
    }

    .brand-text small{
        font-size:7px;
    }

    .timer{
        min-width:78px;
        font-size:10px;
    }

    .container{
        width:calc(100% - 12px);
        padding-top:14px;
    }

    .start-card{
        margin-top:15px;
        padding:24px 17px;
        border-radius:23px;
    }

    .brain{
        width:95px;
        height:95px;
        font-size:52px;
        border-radius:28px;
        margin-bottom:17px;
    }

    .start-card h1{
        font-size:29px;
    }

    .start-card .chapter{
        font-size:10px;
        margin-bottom:22px;
    }

    .two-column{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .exam-info{
        gap:12px;
        font-size:9px;
    }

    .exam-card{
        padding:17px;
        border-radius:20px;
    }

    .illustration{
        height:165px;
        border-radius:17px;
    }

    .illustration-emoji{
        font-size:65px;
    }

    .bubble{
        font-size:7px;
        padding:5px 7px;
    }

    .question-text{
        font-size:18px;
    }

    .option{
        padding:11px;
        font-size:12px;
    }

    .letter{
        min-width:31px;
        height:31px;
    }

    .sidebar{
        padding:15px;
    }

    .result-card{
        padding:25px 18px;
    }

    .score{
        font-size:68px;
    }
}

</style>
</head>

<body>

<!-- =========================
     AUDIO
========================= -->

<audio id="bgMusic" loop preload="auto">
    <source src="music/backsound.mp3" type="audio/mpeg">
</audio>


<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🧠
        </div>

        <div class="brand-text">

            <strong>
                UJIAN INFORMATIKA
            </strong>

            <small>
                BAB 1 • BERPIKIR KOMPUTASIONAL
            </small>

        </div>

    </div>


    <div class="top-actions">

        <button
            class="music-btn"
            id="musicBtn"
            onclick="toggleMusic()">
            🔊
        </button>

        <div
            class="timer"
            id="timer">
            40:00
        </div>

    </div>

</header>


<main class="container">


<!-- =========================
     START
========================= -->

<section
    class="start-card"
    id="startPage">


    <div class="brain">
        🧠
    </div>


    <h1>
        Berpikir<br>
        Komputasional
    </h1>


    <p class="chapter">
        Ulangan Harian • Kelas VII
    </p>


    <div class="form">


        <div class="field">

            <label>
                NAMA LENGKAP
            </label>

            <input
                id="studentName"
                type="text"
                placeholder="Masukkan nama kamu">

        </div>


        <div class="two-column">


            <div class="field">

                <label>
                    KELAS
                </label>

                <select id="studentClass">

                    <option value="">
                        Pilih kelas
                    </option>

                    <option>7A</option>
                    <option>7B</option>
                    <option>7C</option>
                    <option>7D</option>
                    <option>7E</option>
                    <option>7F</option>
                    <option>7G</option>
                    <option>7H</option>

                </select>

            </div>


            <div class="field">

                <label>
                    NO. ABSEN
                </label>

                <select id="studentNumber">

                    <option value="">
                        Pilih absen
                    </option>

                </select>

            </div>


        </div>


        <div class="exam-info">

            <span>
                📝 <b>25 Soal</b>
            </span>

            <span>
                ⏱️ <b>40 Menit</b>
            </span>

        </div>


        <button
            class="start-button"
            onclick="startExam()">

            🚀 MULAI UJIAN

        </button>


        <div class="music-control">

            <span id="musicText">
                🎵 Musik ON
            </span>

            <input
                id="volume"
                class="volume"
                type="range"
                min="0"
                max="100"
                value="80"
                oninput="changeVolume(this.value)">

        </div>


        <p class="teacher">
            Guru Pengampu • Farah Nisa
        </p>


    </div>

</section>



<!-- =========================
     EXAM
========================= -->

<section
    class="exam-layout hidden"
    id="examPage">


    <div class="exam-card">


        <div class="question-top">

            <span
                class="question-number"
                id="questionNumber">
                Soal 1 dari 25
            </span>

            <span
                class="level"
                id="questionLevel">
                LOTS
            </span>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <div
            id="illustration"
            class="illustration">
        </div>


        <h2
            id="questionText"
            class="question-text">
        </h2>


        <div id="options">
        </div>


        <div class="nav">

            <button
                class="btn"
                id="prevBtn"
                onclick="previousQuestion()">

                ← Sebelumnya

            </button>


            <button
                class="btn primary"
                id="nextBtn"

===================================================== */

const bgMusic =

let musicOn = true;


/*
   80% default.
   Ini sengaja dibuat lebih keras daripada
   versi sebelumnya.
*/

bgMusic.volume = 0.8;


function startMusic(){

    if(!musicOn) return;

    bgMusic.volume =
        Number(
            document.getElementById(
                "volume"
            ).value
        ) / 100;


    bgMusic.play()
        .then(()=>{

            document.getElementById(
                "musicBtn"
            ).textContent="🔊";

            document.getElementById(
                "musicText"
            ).textContent=
                "🎵 Musik ON";

        })
        .catch(error=>{

            console.log(
                "Musik belum dapat diputar:",
                error
            );

        });

}


function toggleMusic(){

    if(bgMusic.paused){

        musicOn=true;

        startMusic();

    }else{

        musicOn=false;

        bgMusic.pause();

        document.getElementById(
            "musicBtn"
        ).textContent="🔇";

        document.getElementById(
            "musicText"
        ).textContent=
            "🔇 Musik OFF";

    }

}


function changeVolume(value){

    bgMusic.volume =
        Number(value)/100;

}


/* =====================================================
   START
===================================================== */

function startExam(){

    const name =
        document.getElementById(
            "studentName"
        ).value.trim();

    const kelas =
        document.getElementById(
            "studentClass"
        ).value;

    const absen =
        document.getElementById(
            "studentNumber"
        ).value;


    if(!name){

        alert(
            "Nama lengkap belum diisi."
        );

        return;

    }


    if(!kelas){

        alert(
            "Silakan pilih kelas."
        );

        return;

    }


    if(!absen){

        alert(
            "Silakan pilih nomor absen."
        );

        return;

    }


    started=true;


    document.getElementById(
        "startPage"
    ).classList.add("hidden");


    document.getElementById(
        "examPage"
    ).classList.remove("hidden");


    document.getElementById(
        "sideName"
    ).textContent=name;


    document.getElementById(
        "sideInfo"
    ).textContent=
        `${kelas} • Absen ${absen}`;


    renderQuestion();

    startTimer();

    startMusic();


    /*
      Coba fullscreen.
      Tidak semua browser HP mengizinkan
      fullscreen secara otomatis.
    */

    if(
        document.documentElement.requestFullscreen
    ){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timerInterval =
        setInterval(()=>{

            seconds--;

            const min =
                Math.floor(
                    seconds/60
                );

            const sec =
                seconds%60;


            document.getElementById(
                "timer"
            ).textContent =
                `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;


            if(seconds<=300){

                document.getElementById(
                    "timer"
                ).classList.add(
                    "warning"
                );

            }


            if(seconds<=0){

                finishExam(
                    "Waktu habis"
                );

            }

        },1000);

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    const q =
        questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).textContent =
        `Soal ${currentQuestion+1} dari ${questions.length}`;


    document.getElementById(
        "questionLevel"
    ).textContent =
        q.level;


    const percent =
        Math.round(
            ((currentQuestion+1) /
            questions.length)*100
        );


    document.getElementById(
        "progressBar"
    ).style.width =
        percent+"%";


    document.getElementById(
        "questionText"
    ).textContent =
        q.question;


    document.getElementById(
        "illustration"
    ).innerHTML = `

        <div class="bubble b1">
            ${q.tags[0]}
        </div>

        <div class="bubble b2">
            ${q.tags[1]}
        </div>

        <div class="bubble b3">
            💡 THINK
        </div>

        <div class="bubble b4">
            🧠 LOGIC
        </div>

        <div class="illustration-emoji">
            ${q.icon}
        </div>

    `;


    const options =
        document.getElementById(
            "options"
        );

    options.innerHTML="";


    q.options.forEach(
        (text,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className="option";


            if(
                answers[
                    currentQuestion
                ]===index
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.innerHTML=`

                <span class="letter">
                    ${String.fromCharCode(65+index)}
                </span>

                <span>
                    ${text}
                </span>

            `;


            button.onclick=()=>{

                answers[
                    currentQuestion
                ]=index;

                renderQuestion();

            };


            options.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "prevBtn"
    ).disabled =
        currentQuestion===0;


    document.getElementById(
        "nextBtn"
    ).textContent =
        currentQuestion ===
        questions.length-1
        ? "🏁 Kumpulkan"
        : "Berikutnya →";


    renderNumbers();

}


/* =====================================================
   NUMBER
===================================================== */

function renderNumbers(){

    const box =
        document.getElementById(
            "numbers"
        );

    box.innerHTML="";


    questions.forEach(
        (_,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className="num";

            button.textContent =
                index+1;


            if(
                answers[index]!==null
            ){

                button.classList.add(
                    "done"
                );

            }


            if(
                index===currentQuestion
            ){

                button.classList.add(
                    "current"
                );

            }


            button.onclick=()=>{

                currentQuestion=index;

                renderQuestion();

            };


            box.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function nextQuestion(){

    if(
        currentQuestion <
        questions.length-1
    ){

        currentQuestion++;

        renderQuestion();

    }else{

        confirmSubmit();

    }

}


function previousQuestion(){

    if(currentQuestion>0){

        currentQuestion--;

        renderQuestion();

    }

}


/* =====================================================
   SUBMIT
===================================================== */

function confirmSubmit(){

    const unanswered =
        answers.filter(
            x=>x===null
        ).length;


    if(unanswered>0){

        const confirmResult =
            confirm(
                `Masih ada ${unanswered} soal yang belum dijawab.\n\nYakin ingin mengumpulkan?`
            );

        if(!confirmResult) return;

    }else{

        const confirmResult =
            confirm(
                "Semua soal sudah dijawab.\n\nYakin ingin mengumpulkan?"
            );

        if(!confirmResult) return;

    }


    finishExam(
        "Ujian dikumpulkan"
    );

}


/* =====================================================
   ANTI CHEATING
===================================================== */

function violation(message){

    if(
        !started ||
        finished
    ) return;


    violations++;


    alert(
        `⚠️ PERINGATAN ${violations}/3\n\n${message}`
    );


    if(violations>=3){

        finishExam(
            "Ujian dihentikan karena pelanggaran"
        );

    }

}


/*
   Jika siswa keluar dari halaman/tab.
*/

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            started &&
            !finished &&
            document.hidden
        ){

            violation(
                "Kamu meninggalkan halaman ujian."
            );

        }

    }
);


/*
   Cegah copy/cut/paste.
*/

["copy","cut","paste"].forEach(
    eventName=>{

        document.addEventListener(
            eventName,
            event=>{

                if(
                    started &&
                    !finished
                ){

                    event.preventDefault();

                    violation(
                        `${eventName.toUpperCase()} tidak diperbolehkan.`
                    );

                }

            }
        );

    }
);


/*
   Jika fullscreen keluar.
*/

document.addEventListener(
    "fullscreenchange",
    ()=>{

        if(
            started &&
            !finished &&
            !document.fullscreenElement
        ){

            violation(
                "Mode fullscreen ditutup."
            );

        }

    }
);


/* =====================================================
   FINISH
===================================================== */

async function finishExam(reason){

    if(finished) return;

    finished=true;


    clearInterval(
        timerInterval
    );


    bgMusic.pause();


    let correct=0;


    answers.forEach(
        (answer,index)=>{

            if(
                answer ===
                questions[index].answer
            ){

                correct++;

            }

        }
    );


    const score =
        Math.round(
            correct /
            questions.length *
            100
        );


    const happy =
        score>=75;


    document.getElementById(
        "examPage"
    ).classList.add("hidden");


    document.getElementById(
        "resultPage"
    ).classList.remove("hidden");


    document.getElementById(
        "resultEmoji"
    ).textContent =
        happy
        ? "🥳🎉"
        : "😢💪";


    document.getElementById(
        "resultTitle"
    ).textContent =
        happy
        ? "Mantap! Kamu Hebat! 🎉"
        : "Tetap Semangat! 💪";


    document.getElementById(
        "resultName"
    ).textContent =
        `${document.getElementById("studentName").value}
        • ${document.getElementById("studentClass").value}
        • Absen ${document.getElementById("studentNumber").value}`;


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "resultDetail"
    ).textContent =
        `${correct} dari ${questions.length} soal benar • ${reason}`;


    if(happy){

        createConfetti();

    }


    const data={

        timestamp:
            new Date().toLocaleString(
                "id-ID"
            ),

        nama:
            document.getElementById(
                "studentName"
            ).value.trim(),

        kelas:
            document.getElementById(
                "studentClass"
            ).value,

        no_absen:
            document.getElementById(
                "studentNumber"
            ).value,

        guru:
            "Farah Nisa",

        bab:
            "BAB 1 - Berpikir Komputasional",

        nilai:
            score,

        benar:
            correct,

        total:
            questions.length,

        pelanggaran:
            violations,

        status:
            reason

    };


    const sent =
        await sendToSpreadsheet(
            data
        );


    document.getElementById(
        "sendStatus"
    ).textContent =
        sent
        ? "✅ Nilai berhasil dikirim ke spreadsheet."
        : "⚠️ Spreadsheet belum terhubung.";

    createReview();

}


/* =====================================================
   SPREADSHEET
===================================================== */

async function sendToSpreadsheet(data){

    if(
        GOOGLE_SCRIPT_URL.includes(
            "TEMPEL_URL"
        )
    ){

        return false;

    }


    try{

        await fetch(
            GOOGLE_SCRIPT_URL,
            {
                method:"POST",
                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)
            }
        );


        return true;

    }catch(error){

        console.error(error);

        return false;

    }

}


/* =====================================================
   REVIEW
===================================================== */

function createReview(){

    const review =
        document.getElementById(
            "review"
        );


    review.innerHTML =
        "<h3>📋 Review Jawaban</h3>";


    questions.forEach(
        (q,index)=>{

            const correct =
                answers[index] ===
                q.answer;


            const div =
                document.createElement(
                    "div"
                );


            div.className="review-item";


            div.innerHTML=`

                <b class="${
                    correct
                    ? "correct"
                    : "wrong"
                }">

                    ${index+1}.
                    ${
                        correct
                        ? "✓ Benar"
                        : "✕ Salah"
                    }

                </b>

                <br>

                ${q.question}

                <br>

                <small style="color:#8d98af">

                    Jawaban benar:
                    ${q.options[q.answer]}

                </small>

            `;


            review.appendChild(div);

        }
    );

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    const box =
        document.getElementById(
            "confetti"
        );


    const emojis=[
        "🎉",
        "✨",
        "🎊",
        "⭐",
        "🥳",
        "💜",
        "🧠"
    ];


    for(
        let i=0;
        i<70;
        i++
    ){

        const span =
            document.createElement(
                "span"
            );


        span.textContent =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


        span.style.left =
            Math.random()*100+"%";


        span.style.animationDelay =
            Math.random()*1.5+"s";


        box.appendChild(span);


        setTimeout(
            ()=>span.remove(),
            4000
        );

    }

}
