<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ujian Informatika Kelas VII</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172033}.hidden{display:none!important}
header{background:#111827;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.timer{background:#1f2937;padding:10px 14px;border-radius:12px;font-weight:800}
main{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 30px #00000012}.welcome{max-width:700px;margin:50px auto;text-align:center}.hero{font-size:65px}.muted{color:#64748b}
input{width:100%;padding:13px;border:2px solid #e5e7eb;border-radius:11px;margin:6px 0 14px;font-size:16px}label{display:block;text-align:left;font-weight:700;font-size:14px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}
.layout{display:grid;grid-template-columns:1fr 250px;gap:18px}.head{display:flex;justify-content:space-between;align-items:center}.progress{height:8px;background:#e5e7eb;border-radius:20px;margin:18px 0;overflow:hidden}.bar{height:100%;background:#4f46e5;width:0}.question{font-size:22px;line-height:1.45}.option{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:15px;margin:10px 0;border:2px solid #e5e7eb;border-radius:13px;background:#fff;cursor:pointer}.option.selected{border-color:#4f46e5;background:#eef2ff}.letter{min-width:32px;height:32px;display:grid;place-items:center;background:#f1f5f9;border-radius:9px;font-weight:800}.selected .letter{background:#4f46e5;color:#fff}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.num{padding:9px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}.num.done{background:#dcfce7;color:#166534}.num.current{outline:3px solid #c7d2fe}.nav{display:flex;justify-content:space-between;margin-top:22px}.result{text-align:center;max-width:700px;margin:30px auto}.emoji{font-size:85px}.score{font-size:65px;font-weight:900;color:#4f46e5}.review{text-align:left}.review div{padding:12px 0;border-bottom:1px solid #eee}.good{color:#16a34a}.bad{color:#dc2626}
@media(max-width:750px){.layout{grid-template-columns:1fr}.side{order:2}main{padding:10px}.card{padding:18px}.question{font-size:19px}}
</style>
</head>
<body>
<header><div class="brand">🧠 UJIAN INFORMATIKA <small>Kelas VII</small></div><div id="timer" class="timer">25:00</div></header>
<main>
<section id="start" class="card welcome">
<div class="hero">💻✨</div><h1>Ulangan Harian Informatika</h1>
<p class="muted">25 soal • LOTS • MOTS • HOTS</p>
<p class="muted">Hasil nilai akan otomatis dikirim ke Google Spreadsheet setelah ujian dikumpulkan.</p>
<label>Nama Lengkap</label><input id="studentName" placeholder="Masukkan nama">
<label>Kelas</label><input id="studentClass" placeholder="Contoh: 7A">
<button class="btn primary" style="width:100%" onclick="start()">🚀 Mulai Ujian</button>
</section>

<section id="exam" class="layout hidden">
<div class="card">
<div class="head"><div><b id="qnum"></b><div id="level" class="muted"></div></div><b id="pct">0%</b></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 id="question" class="question"></h2><div id="options"></div>
<div class="nav"><button id="prev" class="btn secondary" onclick="prev()">← Sebelumnya</button><button id="next" class="btn primary" onclick="next()">Berikutnya →</button></div>
</div>
<aside class="card side"><b id="sideName"></b><p id="sideClass" class="muted"></p><h3>Nomor Soal</h3><div id="numbers" class="numbers"></div><button class="btn danger" style="width:100%;margin-top:20px" onclick="submitConfirm()">Kumpulkan Ujian</button></aside>
</section>

<section id="result" class="card result hidden">
<div id="resultEmoji" class="emoji">🎉</div><h1 id="resultTitle"></h1><p id="resultStudent"></p><div id="score" class="score">0</div><p id="detail"></p><p id="sendStatus" class="muted">Mengirim nilai ke spreadsheet...</p>
<button class="btn primary" onclick="location.reload()">🔄 Selesai</button>
<div id="review" class="review"></div>
</section>
</main>

<script>
// ============================================================
// TEMPEL URL WEB APP GOOGLE APPS SCRIPT DI BARIS DI BAWAH INI
// Contoh: https://script.google.com/macros/s/XXXXXXXX/exec
// ============================================================
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUhb41nZqWz1Yw6isEIcx_XmB0BNw0lTXQEtGd9Ylkip5_Su_A6QIn0Nyvg5uL-l7A/exec";

const qs=[
["LOTS","Informatika","Informatika adalah bidang yang mempelajari...",["Cara menggunakan media sosial saja","Pengolahan informasi dan pemecahan masalah dengan sistem komputasi","Cara memperbaiki semua jenis komputer","Cara bermain game"],1],
["LOTS","Informatika","Salah satu peran informatika dalam kehidupan sehari-hari adalah...",["Membantu mengolah dan menyajikan informasi","Membuat semua manusia tidak perlu bekerja","Menghilangkan kebutuhan belajar","Membuat keputusan manusia selalu benar"],0],
["MOTS","Informatika","Aplikasi peta digital dapat membantu seseorang memilih rute perjalanan. Contoh tersebut menunjukkan informatika membantu...",["Menggambar tanpa tujuan","Memecahkan masalah dalam kehidupan sehari-hari","Menghapus data","Mengurangi jumlah kendaraan secara otomatis"],1],
["LOTS","Keterampilan Generik","Kegiatan membagi tugas dan bekerja bersama untuk mencapai tujuan merupakan...",["Kerja kelompok","Abstraksi","Dekomposisi data","Enkripsi"],0],
["MOTS","Keterampilan Generik","Saat berdiskusi, pendapat teman berbeda dengan pendapatmu. Sikap yang paling tepat adalah...",["Memotong pembicaraan","Mendengarkan alasan lalu mendiskusikannya","Memaksakan pendapat sendiri","Tidak mau bekerja lagi"],1],
["MOTS","Keterampilan Generik","Presentasi yang baik sebaiknya dilakukan dengan...",["Penjelasan runtut dan mudah dipahami","Membaca semua tulisan tanpa menjelaskan","Berbicara secepat mungkin","Tidak melihat audiens sama sekali"],0],
["LOTS","Berpikir Komputasional","Memecah masalah besar menjadi bagian-bagian kecil disebut...",["Abstraksi","Dekomposisi","Optimasi","Presentasi"],1],
["LOTS","Berpikir Komputasional","Mencari kesamaan atau keteraturan dari beberapa data disebut...",["Pengenalan pola","Dekomposisi","Algoritma","Komunikasi"],0],
["LOTS","Berpikir Komputasional","Mengambil informasi penting dan mengabaikan informasi yang tidak diperlukan disebut...",["Abstraksi","Presentasi","Sorting","Jaringan"],0],
["LOTS","Berpikir Komputasional","Urutan langkah yang sistematis untuk menyelesaikan masalah disebut...",["Algoritma","Folder","Data","Grafik"],0],
["MOTS","Berpikir Komputasional","Raka ingin membuat program menghitung rata-rata nilai. Ia memisahkan masalah menjadi input nilai, penjumlahan, pembagian, dan output. Ini contoh...",["Dekomposisi","Pengenalan pola","Abstraksi","Optimasi jadwal"],0],
["MOTS","Berpikir Komputasional","Dari data 2, 4, 6, 8, 10, siswa menyadari setiap angka bertambah 2. Ia sedang menggunakan...",["Pengenalan pola","Abstraksi","Komunikasi","Presentasi"],0],
["MOTS","Abstraksi","Saat membuat denah menuju sekolah, informasi warna sepatu siswa tidak dicantumkan. Alasannya adalah...",["Informasi tersebut tidak penting untuk tujuan denah","Warna sepatu sulit dihitung","Denah harus selalu berwarna hitam putih","Semua informasi harus dihapus"],0],
["LOTS","Algoritma","Langkah pertama yang baik ketika membuat algoritma adalah...",["Menentukan masalah atau tujuan","Langsung menulis hasil","Menghapus semua data","Memilih warna tampilan"],0],
["MOTS","Algoritma","Urutan yang paling tepat untuk membuat mi instan adalah...",["Makan → masak air → masukkan mi","Masak air → masukkan mi → tunggu matang → sajikan","Sajikan → masak air → makan","Masukkan mi → makan → masak air"],1],
["MOTS","Algoritma","Mengapa langkah algoritma harus berurutan dan jelas?",["Agar dapat dilaksanakan sesuai tujuan","Agar terlihat lebih panjang","Agar sulit dipahami","Agar tidak perlu diuji"],0],
["LOTS","Efektif, Efisien, Optimal","Solusi yang berhasil mencapai tujuan disebut...",["Efektif","Acak","Tidak valid","Boros"],0],
["LOTS","Efektif, Efisien, Optimal","Solusi yang mencapai tujuan dengan penggunaan waktu atau sumber daya yang hemat disebut...",["Efisien","Tidak efektif","Acak","Buntu"],0],
["MOTS","Efektif, Efisien, Optimal","Cara A menyelesaikan tugas dengan benar dalam 15 menit. Cara B benar dalam 7 menit. Keduanya menggunakan sumber daya yang sama. Mana yang lebih efisien?",["Cara A","Cara B","Keduanya tidak efisien","Tidak dapat dibandingkan"],1],
["MOTS","Efektif, Efisien, Optimal","Dari beberapa solusi yang sama-sama berhasil, solusi terbaik sesuai tujuan dan batasan disebut...",["Optimal","Acak","Tidak efektif","Sementara"],0],
["HOTS","Optimasi Penjadwalan","Satu laboratorium digunakan oleh tiga kelas. Ketiganya meminta jadwal pada pukul 09.00. Apa solusi paling logis?",["Membiarkan ketiganya masuk bersamaan","Membagi waktu penggunaan laboratorium","Membatalkan semua kelas","Memilih kelas secara acak"],1],
["HOTS","Optimasi Penjadwalan","Sebuah jadwal memiliki dua kegiatan yang memakai ruang yang sama pada waktu yang sama. Masalah utama pada jadwal tersebut adalah...",["Warna jadwal","Konflik waktu dan sumber daya","Ukuran tulisan","Nama kegiatan"],1],
["HOTS","Optimasi Penjadwalan","Empat kelompok harus presentasi. Setiap kelompok membutuhkan 10 menit dan tersedia waktu 40 menit. Agar semua kelompok mendapat kesempatan, strategi terbaik adalah...",["Semua presentasi bersamaan","Memberi setiap kelompok satu slot 10 menit","Memilih dua kelompok saja","Membiarkan waktu berjalan tanpa jadwal"],1],
["HOTS","Optimasi Penjadwalan","Dina punya kegiatan A 07.00–08.00, B 07.30–08.30, dan C 08.30–09.00. Jika semua kegiatan menggunakan ruangan yang sama, jadwal mana yang bermasalah?",["A dan B","B dan C","A dan C","Tidak ada"],0],
["HOTS","Optimasi Penjadwalan","Sekolah ingin menggunakan satu ruang komputer seefisien mungkin. Ada 3 kelas, masing-masing membutuhkan 30 menit dan tidak boleh bentrok. Jadwal yang paling optimal adalah...",["Ketiga kelas memakai ruang bersamaan","Kelas 1 pukul 08.00, kelas 2 pukul 08.30, kelas 3 pukul 09.00","Semua kelas mulai pukul 09.00","Hanya kelas 1 yang menggunakan ruang"],1]
].map(x=>({level:x[0],cat:x[1],q:x[2],o:x[3],a:x[4]}));

let i=0,ans=Array(25).fill(null),sec=1500,tm,viol=0,started=false,finished=false;
function shuffle(a){for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}}
function start(){
 if(!studentName.value.trim()||!studentClass.value.trim()){alert("Nama dan kelas wajib diisi.");return}
 shuffle(qs);started=true;sideName.textContent=studentName.value.trim();sideClass.textContent="Kelas "+studentClass.value.trim();
 document.getElementById("start").classList.add("hidden");exam.classList.remove("hidden");render();
 tm=setInterval(()=>{sec--;let m=Math.floor(sec/60),s=sec%60;timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;if(sec<=0)finish("Waktu habis")},1000);
 try{document.documentElement.requestFullscreen()}catch(e){}
}
function render(){let q=qs[i];qnum.textContent=`Soal ${i+1} dari 25`;level.textContent=`${q.cat} • ${q.level}`;question.textContent=q.q;let p=Math.round((i+1)/25*100);bar.style.width=p+"%";pct.textContent=p+"%";options.innerHTML="";
 q.o.forEach((x,k)=>{let b=document.createElement("button");b.className="option"+(ans[i]===k?" selected":"");b.innerHTML=`<span class="letter">${String.fromCharCode(65+k)}</span><span>${x}</span>`;b.onclick=()=>{ans[i]=k;render()};options.appendChild(b)});
 prev.disabled=i===0;next.textContent=i===24?"Kumpulkan ✓":"Berikutnya →";numbers.innerHTML="";qs.forEach((_,k)=>{let b=document.createElement("button");b.className="num "+(ans[k]!==null?"done ":"")+(k===i?"current":"");b.textContent=k+1;b.onclick=()=>{i=k;render()};numbers.appendChild(b)})}
function next(){if(i<24){i++;render()}else submitConfirm()}function prev(){if(i>0){i--;render()}}
function submitConfirm(){if(confirm("Yakin ingin mengumpulkan ujian?"))finish("Ujian dikumpulkan")}
function warn(msg){if(!started||finished)return;viol++;alert(`⚠️ Peringatan ${viol}/3\n${msg}`);if(viol>=3)finish("Ujian dihentikan karena 3 pelanggaran")}
document.addEventListener("visibilitychange",()=>{if(document.hidden)warn("Kamu meninggalkan halaman ujian.")});
document.addEventListener("copy",e=>{e.preventDefault();warn("Copy tidak diperbolehkan.")});document.addEventListener("cut",e=>{e.preventDefault();warn("Cut tidak diperbolehkan.")});document.addEventListener("paste",e=>{e.preventDefault();warn("Paste tidak diperbolehkan.")});
document.addEventListener("fullscreenchange",()=>{if(started&&!finished&&!document.fullscreenElement)warn("Mode fullscreen ditutup.")});
async function sendToSheet(data){
 if(GOOGLE_SCRIPT_URL.includes("TEMPEL_"))return false;
 try{await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});return true}catch(e){return false}
}
async function finish(reason){if(finished)return;finished=true;clearInterval(tm);let correct=ans.reduce((s,v,k)=>s+(v===qs[k].a?1:0),0),nilai=Math.round(correct/25*100),happy=nilai>=75;
 exam.classList.add("hidden");result.classList.remove("hidden");resultEmoji.textContent=happy?"🥳🎉":"😢💪";resultTitle.textContent=happy?"Hebat! Ujian selesai!":"Tetap semangat!";resultStudent.textContent=`${studentName.value.trim()} • Kelas ${studentClass.value.trim()}`;score.textContent=nilai;detail.textContent=`${correct} benar dari 25 soal • ${reason}`;
 let payload={timestamp:new Date().toLocaleString("id-ID"),nama:studentName.value.trim(),kelas:studentClass.value.trim(),nilai,benar:correct,total:25,pelanggaran:viol,status:reason};
 let sent=await sendToSheet(payload);sendStatus.textContent=sent?"✅ Nilai berhasil dikirim ke Google Spreadsheet.":"⚠️ Nilai belum terhubung ke Spreadsheet. Pastikan URL Apps Script sudah dipasang.";
 review.innerHTML="<h2>📋 Review Jawaban</h2>";qs.forEach((q,k)=>{let ok=ans[k]===q.a;review.innerHTML+=`<div><b class="${ok?"good":"bad"}">${k+1}. ${ok?"Benar":"Salah"}</b><br>${q.q}<br><small>Jawaban benar: ${q.o[q.a]}</small></div>`})}
</script>
</body></html>
